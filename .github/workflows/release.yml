# Publishing is started by a person, from this workflow, and never by a push or a tag.
#
# That is deliberate. If landing a tag published a package, then a stolen push credential would be
# enough to publish one, with no human in the loop. Requiring a manual dispatch plus an environment
# approval means a version bump reaching main is inert on its own, and a credential alone cannot
# ship anything.
name: release

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Version to publish, e.g. 0.1.0 for a stable release. Leave empty for the prerelease default in src/Directory.Build.props."
        required: false
        type: string
      dry_run:
        description: "Build and validate the package, but do not push it."
        required: false
        default: true
        type: boolean

permissions:
  contents: read

env:
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true
  CI: true

jobs:
  validate:
    name: validate
    runs-on: ubuntu-latest

    steps:
      - name: Refuse to release from anywhere but main
        if: github.ref != 'refs/heads/main'
        run: |
          echo "::error::Releases are cut from main only. This ref is ${{ github.ref }}."
          exit 1

      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      - name: Restore
        run: dotnet restore Theon.slnx

      - name: Build
        run: dotnet build Theon.slnx -c Release --no-restore

      - name: Test
        run: dotnet build eng/Tests.proj -c Release

      - name: Verify formatting
        run: dotnet format Theon.slnx --verify-no-changes --severity warn

  publish:
    name: publish
    needs: validate
    runs-on: ubuntu-latest

    permissions:
      contents: read
      # Lets this job mint the short-lived OIDC token that nuget.org exchanges for a
      # temporary API key. Nothing else in the repository can request one.
      id-token: write

    # This is the approval gate. Configure the `nuget` environment in the repository settings with
    # at least one required reviewer; the job then waits for a human before it runs.
    #
    # The name also has to match the Environment field on the nuget.org trusted publishing policy.
    # nuget.org validates it as a claim inside the OIDC token, so a workflow that ran outside this
    # environment — and therefore outside the approval gate — is refused a key.
    environment:
      name: nuget
      url: https://www.nuget.org/packages/Theon

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      - name: Pack
        run: |
          # An empty version means the default from src/Directory.Build.props, which is a
          # prerelease. Cutting a stable release is a deliberate act: type the version.
          #
          # This used to clear VersionSuffix here, which meant the path of least effort — open
          # the workflow, click Run, fill nothing in — published a stable version. Publishing a
          # stable version is the least reversible thing this workflow can do, so it must not be
          # what happens by default.
          # Packs every packable project under src/, so a new satellite package ships by
          # existing rather than by remembering to add a line here. They version in lockstep.
          if [ -n "${{ inputs.version }}" ]; then
            dotnet pack Theon.slnx -c Release -p:Version='${{ inputs.version }}'
          else
            dotnet pack Theon.slnx -c Release
          fi

      - name: Show what would be published
        run: |
          ls -la artifacts/package/release/
          for f in artifacts/package/release/*.nupkg; do
            echo "=== $f ==="
            unzip -p "$f" '*.nuspec'
          done

      - name: Upload the package as a build artifact
        uses: actions/upload-artifact@v4
        with:
          name: nuget-package
          path: artifacts/package/release/*
          if-no-files-found: error

      # Trusted Publishing: no long-lived API key is stored anywhere. GitHub issues a signed
      # OIDC token describing this repository, workflow and environment; nuget.org checks it
      # against the policy and returns a key valid for one hour. A leaked repository secret
      # cannot publish, because there is no publishing secret to leak.
      #
      # This runs immediately before the push on purpose: the key expires after an hour, and
      # each token buys exactly one key.
      - name: NuGet login (OIDC to short-lived key)
        if: ${{ !inputs.dry_run }}
        uses: NuGet/login@v1
        id: login
        with:
          # The nuget.org profile name that owns the package, not an e-mail address. It is
          # public, since it appears on the package page, so it is not held as a secret.
          user: bminervino

      - name: Push to NuGet
        if: ${{ !inputs.dry_run }}
        run: |
          # No --skip-duplicate: republishing an existing version should fail loudly, because
          # it means the version was not raised and somebody is about to be confused.
          dotnet nuget push artifacts/package/release/*.nupkg \
            --source https://api.nuget.org/v3/index.json \
            --api-key "${{ steps.login.outputs.NUGET_API_KEY }}"

      - name: Say what happened
        run: |
          if [ "${{ inputs.dry_run }}" = "true" ]; then
            echo "### Dry run: package built and attached, nothing published." >> $GITHUB_STEP_SUMMARY
          else
            echo "### Published to nuget.org." >> $GITHUB_STEP_SUMMARY
          fi
